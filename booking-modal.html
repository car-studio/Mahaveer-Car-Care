<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mahaveer Car Care - Booking Modal</title>

 <style>

/* ==========================================
   MAHAVEER CAR CARE BOOKING MODAL
========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* Overlay */

.booking-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    justify-content:center;

    align-items:flex-start;

    padding:30px 20px;

    overflow-y:auto;

    z-index:99999;

}

/* Modal */

.booking-modal{

    width:100%;

    max-width:560px;

    max-height:calc(100vh - 60px);

    overflow-y:auto;

    background:#111111;

    border-radius:20px;

    padding:35px;

    position:relative;

    border:1px solid #ff9800;

    box-shadow:
        0 0 8px rgba(255,152,0,.55),
        0 0 22px rgba(255,152,0,.35),
        0 25px 60px rgba(0,0,0,.55);

    scrollbar-width:none;
    -ms-overflow-style:none;
}

.booking-modal::-webkit-scrollbar{
    display:none;
}
  
/* Close */

.close-modal{

    position:absolute;

    right:20px;

    top:15px;

    background:none;

    border:none;

    color:#ffffff;

    font-size:32px;

    cursor:pointer;

    transition:.3s;

}

.close-modal:hover{

    color:#ff9800;

}

/* Heading */

.booking-header{

    text-align:center;

    margin-bottom:30px;

}

.booking-header h2{

    color:#ffffff;

    font-size:32px;

    font-weight:700;

    margin-bottom:10px;

}

.booking-header p{

    color:#cfcfcf;

    line-height:1.7;

}

/* Form */

.form-group{

    margin-bottom:18px;

}

.form-group label{

    display:block;

    color:#ffffff;

    margin-bottom:8px;

    font-weight:600;

}

/* Inputs */

.form-group input,

.form-group textarea{

    width:100%;

    padding:14px 16px;

    background:#1b1b1b;

    border:1px solid #333;

    border-radius:10px;

    color:#ffffff;

    font-size:15px;

    transition:.3s;

}

.form-group input:focus,

.form-group textarea:focus{

    outline:none;

    border-color:#ff9800;

    box-shadow:0 0 12px rgba(255,152,0,.25);

}

/* Placeholder */

::placeholder{

    color:#9b9b9b;

}

/* WhatsApp Button */

.book-whatsapp-btn{

    width:100%;

    margin-top:10px;

    background:#ff9800;

    color:#111;

    border:none;

    padding:16px;

    font-size:17px;

    font-weight:700;

    border-radius:10px;

    cursor:pointer;

    transition:.3s;

}

.book-whatsapp-btn:hover{

    background:#ffb733;

    transform:translateY(-2px);

}

/* Responsive */

@media(max-width:600px){

.booking-modal{

padding:25px;

}

.booking-header h2{

font-size:26px;

}

}

</style>
    
</head>  
    
<body>

    <!-- ==========================
         BOOKING MODAL
    =========================== -->

    <div id="bookingOverlay" class="booking-overlay">

        <div class="booking-modal">

            <!-- Close Button -->
            <button class="close-modal" id="closeBooking">
                &times;
            </button>

            <!-- Heading -->
            <div class="booking-header">

                <h2 id="serviceTitle">
                    Book Service
                </h2>

                <p>
                    Fill in your details and we'll connect with you on WhatsApp.
                </p>

            </div>

            <!-- Booking Form -->
            <form id="bookingForm">

                <div class="form-group">
                    <label>Full Name *</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input
                        type="tel"
                        id="customerMobile"
                        placeholder="Enter your mobile number"
                        required>
                </div>

                <div class="form-group">
                    <label>Vehicle Brand & Model *</label>
                    <input
                        type="text"
                        id="vehicleModel"
                        placeholder="Example: Hyundai Creta"
                        required>
                </div>

                <div class="form-group">
                    <label>Preferred Date *</label>
                    <input
                        type="date"
                        id="preferredDate"
                        required>
                </div>

                <div class="form-group">
                    <label>Preferred Time</label>
                    <input
                        type="time"
                        id="preferredTime">
                </div>

                <div class="form-group">
    <label> Address *</label>

    <textarea
        id="serviceAddress"
        rows="3"
        placeholder="Enter the address where the service is required"
        required></textarea>
</div>

<div class="form-group">
    <label>Your Requirements / Special Requests</label>

    <textarea
        id="additionalNotes"
        rows="3"
        placeholder="Tell us about any specific requirements or special requests..."></textarea>
</div>

                <button
                    type="submit"
                    class="book-whatsapp-btn">

                    Book on WhatsApp

                </button>

            </form>

        </div>

    </div>
    <script>

/* ==========================================
   MAHAVEER CAR CARE BOOKING SYSTEM
   STEP 4 - JAVASCRIPT
========================================== */

/* WhatsApp Number */
const WHATSAPP_NUMBER = "917008100859";

/* Default Service Name */
const SERVICE_NAME =
    typeof window.SERVICE_NAME !== "undefined"
        ? window.SERVICE_NAME
        : "Exterior Wash";


/* Get Elements */

const bookingOverlay =
    document.getElementById("bookingOverlay");

const closeBooking =
    document.getElementById("closeBooking");

const bookingForm =
    document.getElementById("bookingForm");

const serviceTitle =
    document.getElementById("serviceTitle");


/* Hide Booking Popup Initially */

bookingOverlay.style.display = "none";


/* Set Service Name */

serviceTitle.textContent =
    "Book " + SERVICE_NAME;


/* ==========================================
   OPEN BOOKING POPUP
========================================== */

function openBookingPopup(serviceName) {

    const selectedService =
        serviceName || SERVICE_NAME;

    serviceTitle.textContent =
        "Book " + selectedService;

    bookingOverlay.style.display = "flex";

    document.body.style.overflow = "hidden";
}


/* ==========================================
   CLOSE BOOKING POPUP
========================================== */

function closeBookingPopup() {

    bookingOverlay.style.display = "none";

    document.body.style.overflow = "";
}


/* Close Button */

closeBooking.addEventListener(
    "click",
    closeBookingPopup
);


/* ==========================================
   CLOSE WHEN CLICKING OUTSIDE MODAL
========================================== */

bookingOverlay.addEventListener(
    "click",
    function(event) {

        if (event.target === bookingOverlay) {

            closeBookingPopup();

        }

    }
);


/* ==========================================
   CLOSE WITH ESC KEY
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeBookingPopup();

        }

    }
);


/* ==========================================
   BOOK SERVICE BUTTONS
========================================== */

document.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(".btn.primary");

        if (!button) return;

        event.preventDefault();

        openBookingPopup();

    }
);


/* ==========================================
   WHATSAPP BOOKING
========================================== */

bookingForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* Get Form Values */

        const customerName =
            document
            .getElementById("customerName")
            .value
            .trim();

        const customerMobile =
            document
            .getElementById("customerMobile")
            .value
            .trim();

        const vehicleModel =
            document
            .getElementById("vehicleModel")
            .value
            .trim();

        const preferredDate =
            document
            .getElementById("preferredDate")
            .value;

        const preferredTime =
            document
            .getElementById("preferredTime")
            .value;

        const Address =
    document
    .getElementById("serviceAddress")
    .value
    .trim();

        const additionalNotes =
            document
            .getElementById("additionalNotes")
            .value
            .trim();


        /* ==================================
           BASIC MOBILE VALIDATION
        ================================== */

        const mobilePattern =
            /^[0-9]{10}$/;

        if (!mobilePattern.test(customerMobile)) {

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        /* ==================================
           FORMAT DATE
        ================================== */

        let formattedDate =
            preferredDate;

        if (preferredDate) {

            const date =
                new Date(preferredDate);

            formattedDate =
                date.toLocaleDateString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }
                );

        }


        /* ==================================
           CREATE WHATSAPP MESSAGE
        ================================== */

        let message =
`Hello Mahaveer Car Care,

I would like to book the following service.

Service:
${SERVICE_NAME}

Name:
${customerName}

Mobile:
${customerMobile}

Vehicle:
${vehicleModel}

Preferred Date:
${formattedDate}

Preferred Time:
${preferredTime || "Not specified"}

Additional Notes:
${additionalNotes || "None"}

Thank you.`;


        /* ==================================
           WHATSAPP URL
        ================================== */

        const whatsappURL =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodeURIComponent(message);


        /* ==================================
           OPEN WHATSAPP
        ================================== */

        window.open(
            whatsappURL,
            "_blank"
        );

    }
);

</script>

</body>
    
</html>
