<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Used Cars | Mahaveer Car Care</title>

    <meta name="description"
          content="Find your dream car at an affordable price with Mahaveer Car Care. Explore quality pre-owned cars and trusted deals.">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            background: #050505;

            color: #ffffff;

            font-family: 'Poppins', sans-serif;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .used-cars-header {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 92px;

            padding: 0 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(0, 0, 0, 0.68);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            z-index: 1000;
        }


        /* =========================
           LOGO
        ========================= */

        .used-cars-logo {

            display: flex;

            align-items: center;

            gap: 13px;
        }

        .used-cars-logo img {

            width: 60px;
            height: 60px;

            object-fit: contain;

            border-radius: 50%;
        }

        .used-cars-logo-text {

            display: flex;

            flex-direction: column;
        }

        .used-cars-logo-text strong {

            font-size: 24px;

            line-height: 1.1;

            font-weight: 800;

            color: #ffffff;
        }

        .used-cars-logo-text span {

            margin-top: 5px;

            color: #d0d0d0;

            font-size: 10px;

            letter-spacing: 1.6px;
        }


        /* =========================
           HEADER ACTIONS
        ========================= */

        .used-cars-header-actions {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .header-action {

            height: 46px;

            padding: 0 17px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            border-radius: 30px;

            font-size: 12px;

            font-weight: 700;

            transition: 0.3s ease;
        }


        /* Call */

        .header-call {

            background: #ff7200;

            border: 1px solid #ff7200;

            color: #ffffff;
        }

        .header-call:hover {

            background: #ff8500;

            transform: translateY(-2px);
        }


        /* Email */

        .header-email {

            background: rgba(0, 0, 0, 0.45);

            border: 1px solid #ff7200;

            color: #ffffff;
        }

        .header-email:hover {

            background: #ff7200;

            transform: translateY(-2px);
        }


        /* Review */

        .header-review {

            background: transparent;

            border: 1px solid rgba(255, 255, 255, 0.45);

            color: #ffffff;
        }

        .header-review:hover {

            background: #ffffff;

            color: #050505;

            border-color: #ffffff;

            transform: translateY(-2px);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .used-cars-hero {

            position: relative;

            width: 100%;

            min-height: 820px;

            background-image: url('ucb.png');

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            overflow: hidden;
        }


        /* Premium dark overlay */

        .used-cars-hero::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.72) 0%,
                    rgba(0, 0, 0, 0.30) 28%,
                    rgba(0, 0, 0, 0.08) 55%,
                    rgba(0, 0, 0, 0.65) 100%
                );

            z-index: 1;
        }


        /* Bottom fade */

        .used-cars-hero::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 170px;

            background:
                linear-gradient(
                    transparent,
                    #050505
                );

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================================
           HERO BADGE
           TOP LEFT
        ===================================================== */

        .used-cars-hero-badge {

            position: absolute;

            top: 135px;

            left: 5%;

            z-index: 5;

            padding: 10px 22px;

            border: 1px solid #ff7200;

            border-radius: 50px;

            background: rgba(0, 0, 0, 0.58);

            color: #ff7200;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2.5px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35);
        }


        /* =====================================================
           HERO CONTENT
           HEADLINE ABOVE THE CARS
        ===================================================== */

        .used-cars-hero-content {

            position: relative;

            z-index: 4;

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding: 205px 25px 120px;

            text-align: center;
        }


        /* Main headline */

        .used-cars-hero-content h1 {

            max-width: 1050px;

            margin: 0 auto;

            color: #ffffff;

            font-size: clamp(48px, 6.2vw, 86px);

            line-height: 1.02;

            font-weight: 900;

            letter-spacing: -3px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.85);
        }


        .used-cars-hero-content h1 span {

            display: inline;

            margin-top: 7px;

            color: #ff7200;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.85),
                0 0 25px rgba(255, 114, 0, 0.12);
        }


        /* Tagline */

       .used-cars-hero-content p {

    max-width: 700px;

    margin: 205px auto 32px;

    color: #ffffff;

    font-size: 17px;

    line-height: 1.75;

    font-weight: 400;

    text-shadow:
        0 3px 15px rgba(0, 0, 0, 0.9);
}

        /* =====================================================
           HERO BUTTONS
        ===================================================== */

        .used-cars-hero-buttons {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 16px;
        }


        .used-cars-btn {

            min-width: 195px;

            min-height: 56px;

            padding: 15px 26px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border-radius: 50px;

            font-size: 14px;

            font-weight: 700;

            transition: 0.3s ease;
        }


        /* Explore Cars */

        .used-cars-btn.primary {

            background: #ff7200;

            border: 1px solid #ff7200;

            color: #ffffff;

            box-shadow:
                0 10px 30px rgba(255, 114, 0, 0.28);
        }

        .used-cars-btn.primary:hover {

            background: #ff8500;

            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(255, 114, 0, 0.38);
        }


        /* Call Us */

        .used-cars-btn.secondary {

            background: rgba(0, 0, 0, 0.55);

            border: 1px solid #ff7200;

            color: #ffffff;
        }

        .used-cars-btn.secondary:hover {

            background: #ff7200;

            transform: translateY(-3px);
        }


        /* =====================================================
           TEMPORARY NEXT SECTION
        ===================================================== */

        #available-cars {

            min-height: 400px;

            padding: 80px 20px;

            background: #050505;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }

        #available-cars span {

            color: #ff7200;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 2px;
        }

        #available-cars h2 {

            margin-top: 15px;

            color: #ffffff;

            font-size: 38px;

            font-weight: 800;
        }

        #available-cars p {

            margin-top: 15px;

            color: #999999;

            font-size: 14px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {


            /* Header */

            .used-cars-header {

                height: 76px;

                padding: 0 15px;
            }

            .used-cars-logo {

                gap: 8px;
            }

            .used-cars-logo img {

                width: 47px;

                height: 47px;
            }

            .used-cars-logo-text strong {

                font-size: 17px;
            }

            .used-cars-logo-text span {

                font-size: 7px;

                letter-spacing: 1px;
            }


            /* Header buttons */

            .used-cars-header-actions {

                gap: 7px;
            }

            .header-action {

                width: 42px;

                height: 42px;

                padding: 0;

                border-radius: 12px;

                font-size: 15px;
            }

            .header-action span {

                display: none;
            }


            /* Hero */

            .used-cars-hero {

                min-height: 720px;

                background-position: center center;
            }


            .used-cars-hero::before {

                background:
                    linear-gradient(
                        180deg,
                        rgba(0, 0, 0, 0.72) 0%,
                        rgba(0, 0, 0, 0.38) 35%,
                        rgba(0, 0, 0, 0.70) 72%,
                        rgba(0, 0, 0, 0.92) 100%
                    );
            }


            /* Badge */

            .used-cars-hero-badge {

                top: 102px;

                left: 18px;

                padding: 8px 15px;

                font-size: 8px;

                letter-spacing: 1.6px;
            }


            /* Headline */

            .used-cars-hero-content {

                padding: 155px 18px 80px;
            }

            .used-cars-hero-content h1 {

                font-size: 42px;

                line-height: 1.08;

                letter-spacing: -1.5px;
            }


            /* Tagline */

            .used-cars-hero-content p {

                max-width: 350px;

                margin: 22px auto 28px;

                font-size: 13px;

                line-height: 1.7;
            }


            /* Buttons */

            .used-cars-hero-buttons {

                width: 100%;

                flex-direction: column;

                gap: 11px;
            }

            .used-cars-btn {

                width: 100%;

                max-width: 330px;

                min-height: 53px;

                font-size: 13px;
            }
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 480px) {

            .used-cars-header {

                padding: 0 12px;
            }

            .used-cars-logo-text strong {

                font-size: 15px;
            }

            .used-cars-logo-text span {

                font-size: 6px;
            }

            .used-cars-header-actions {

                gap: 5px;
            }

            .header-action {

                width: 39px;

                height: 39px;

                border-radius: 10px;
            }


            .used-cars-hero {

                min-height: 680px;
            }

            .used-cars-hero-badge {

                top: 98px;

                left: 15px;
            }

            .used-cars-hero-content {

                padding: 150px 16px 65px;
            }

            .used-cars-hero-content h1 {

                font-size: 36px;

                letter-spacing: -1px;
            }

            .used-cars-hero-content p {

                font-size: 12.5px;
            }

            .used-cars-btn {

                max-width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="used-cars-header">


        <!-- Logo -->

        <a href="index.html"
           class="used-cars-logo">

            <img src="logo.png"
                 alt="Mahaveer Car Care">

            <div class="used-cars-logo-text">

                <strong>
                    Mahaveer Car Care
                </strong>

                <span>
                    Premium Car Spa &amp; Detailing
                </span>

            </div>

        </a>


        <!-- Only required header actions -->

        <div class="used-cars-header-actions">


            <!-- Call Us -->

            <a href="tel:7008100859"
               class="header-action header-call"
               aria-label="Call Mahaveer Car Care">

                <i class="fa-solid fa-phone"></i>

                <span>
                    Call Us
                </span>

            </a>


            <!-- Email Us -->

            <!-- Replace YOUR-EMAIL@example.com
                 with the actual business email -->

            <a href="mailto:YOUR-EMAIL@example.com"
               class="header-action header-email"
               aria-label="Email Mahaveer Car Care">

                <i class="fa-solid fa-envelope"></i>

                <span>
                    Email Us
                </span>

            </a>


            <!-- Reviews -->

            <a href="index.html#reviews"
               class="header-action header-review"
               aria-label="View Reviews">

                <i class="fa-solid fa-star"></i>

                <span>
                    Reviews
                </span>

            </a>

        </div>

    </header>



    <!-- =====================================================
         USED CARS HERO
    ===================================================== -->

    <section class="used-cars-hero">


        <!-- Badge -->

        <span class="used-cars-hero-badge">
            PREMIUM USED CARS
        </span>


        <!-- Main Hero Content -->

        <div class="used-cars-hero-content">


           <h1>
    Find Your <span>Dream Car</span>
</h1>


            <p>
                Premium Pre-Owned Cars at Affordable Prices.
                Trusted Deals. Drive Home With Confidence.
            </p>


            <div class="used-cars-hero-buttons">


                <a href="#available-cars"
                   class="used-cars-btn primary">

                    <i class="fa-solid fa-car"></i>

                    Explore Cars

                </a>


                <a href="tel:7008100859"
                   class="used-cars-btn secondary">

                    <i class="fa-solid fa-phone"></i>

                    Call Us

                </a>


            </div>

        </div>

    </section>



    <!-- =====================================================
         TEMPORARY SECTION
         We will replace this with the actual used-car
         listing section next.
    ===================================================== -->

    <section id="available-cars">

        <div>

            <span>
                USED CARS
            </span>

            <h2>
                Explore Our Cars
            </h2>

            <p>
                Quality pre-owned cars selected for you.
            </p>

        </div>

    </section>


</body>

</html>
